standards:
- id: tpeg
  name: TPEG (Transport Protocol Experts Group, TISA)
  conforms: true
  evidence: INRIX TPEG Connect delivers traffic, incident, parking, weather and fuel content in TPEG format; Annex
    B is generally available and Annex A under special circumstances.
  docs: https://docs.inrix.com/traffic/tpeg/
- id: openlr
  name: OpenLR dynamic location referencing
  conforms: true
  evidence: Safety Alerts accepts roadSegmentType=TTOpenLr; the Data Download Service ships OpenLR dictionary files
    as a map-release dataset.
  docs: https://docs.inrix.com/reference/dynamiclocationreferencing/
- id: tmc
  name: ALERT-C / TMC location codes
  conforms: true
  evidence: TMC segment identifiers are first-class across the Traffic APIs and map-release datasets (TMCAdded,
    TMCRemoved, TMCReplaced).
- id: iso8601
  name: ISO 8601 date and time
  conforms: true
  evidence: The best-practices reference mandates ISO 8601 with either a Z designator or a +hh:mm/-hh:mm offset.
  docs: https://docs.inrix.com/reference/bestpractices/
- id: geojson
  name: GeoJSON
  conforms: true
  evidence: GeoJSON is a published dataset type in the Data Download Service map-release hierarchy.
- id: oauth2
