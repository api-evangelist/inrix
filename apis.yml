apis:
- name: INRIX Segment Speed API
  description: >-
    Real-time, historical and predicted speed, travel time and reference speed for INRIX XD and TMC road
    segments, queried by bounding box, radius, point, segment set or corridor.
  humanURL: https://docs.inrix.com/traffic/segmentspeed/
  baseURL: https://segment-api.inrix.com
  tags:
  - Traffic
  - Speed
  - Road Segments
  - Real-Time
  - XD
  tags_raw:
  - Traffic
  - Speed
  - Road Segments
  - Real Time
  - XD
- name: INRIX Safety Alerts (Incidents) API
  description: >-
    Roadway incident, construction, flow, event and hazard alerts within a bounding box, radius or along
    a route, with TMC and OpenLR location referencing and TPEG-style event codes.
  humanURL: https://docs.inrix.com/traffic/incidents/
  baseURL: https://incident-api.inrix.com
  tags:
  - Incidents
  - Safety
  - Alerts
  - Traffic
  - Event
  tags_raw:
  - Incidents
  - Safety
  - Alerts
  - Traffic
  - Events
- name: INRIX Traffic Tiles API
  description: >-
    Pre-rendered raster traffic tiles for map overlays, addressed by quadkey and rendered from live INRIX
    speed data.
  humanURL: https://docs.inrix.com/traffic/tiles/
  baseURL: https://tile-api.inrix.com
  tags:
  - Tiles
  - Maps
  - Traffic
  - Raster
  - Visualization
- name: INRIX Fuel Stations API
  description: >-
    Fuel station locations, brands, amenities and current fuel prices by grade, searchable by bounding
    box, radius or station identifier.
  humanURL: https://docs.inrix.com/traffic/fuel/
  baseURL: https://fuel-api.inrix.com
  tags:
  - Fuel
  - Prices
  - Points of Interest
  - Geospatial
  - Automotive
- name: INRIX Dangerous Slowdowns API
  description: >-
    Detects and reports sudden, unexpected slowdowns on the road network so vehicles and drivers can be
    warned ahead of a hazard.
  humanURL: https://docs.inrix.com/traffic/dangerousslowdowns/
  baseURL: https://dsd.api.inrix.com
  tags:
  - Safety
  - Traffic
  - Alerts
  - Connected Vehicles
  - Hazards
- name: INRIX Dangerous Roads API
  description: >-
    Ranked collision and safety risk scoring for road segments, used to identify the most dangerous roads
    and intersections in a geography.
  humanURL: https://docs.inrix.com/analytics/dangerousroads/
  baseURL: https://dangerousroads-api.inrix.com
  tags:
  - Safety
  - Analytics
  - Collisions
  - Road Network
  - Risk
- name: INRIX Trade Area Trips API
  description: >-
    Aggregated, anonymized trip origin-destination counts into and out of a defined trade area or location
    polygon, for retail site selection and location analytics.
  humanURL: https://docs.inrix.com/analytics/tradeareatrips/
  baseURL: https://trade-areas-api.inrix.com
  tags:
  - Analytics
  - Trips
  - Trade Area
  - Retail
  - Location Intelligence
- name: INRIX Trip Trends Reports API
  description: >-
    Trip volume and travel-behaviour trend reports over time for a geography, including seasonal adjustment
    and data-quality metadata.
  humanURL: https://docs.inrix.com/analytics/triptrends/
  baseURL: https://triptrends-api.inrix.com
  tags:
  - Analytics
  - Trips
  - Reports
  - Trends
  - Mobility
- name: INRIX Roadway Analytics Data Downloader API
  description: >-
    Asynchronous report and bulk speed-data downloader for INRIX Roadway Analytics: submit a report request,
    poll its status and retrieve the generated dataset.
  humanURL: https://docs.inrix.com/ra/speedsdatadownloader/
  baseURL: https://roadway-analytics-api.inrix.com
  tags:
  - Analytics
  - Bulk Data
  - Reports
  - Roadway
  - Downloads
  tags_raw:
  - Analytics
  - Bulk Data
  - Reports
  - Roadway
  - Download
- name: INRIX Data Download Service
  description: >-
    Queries and downloads static INRIX data deliverables organized by product, dataset and file - beginning
    with map releases (XD added/removed/replaced, TMC changes, OpenLR dictionaries, shapefiles and GeoJSON
    conflations).
  humanURL: https://docs.inrix.com/datadownload/datadownload/
  baseURL: https://mapdata.inrix.io
  tags:
  - Bulk Data
  - Maps
  - Downloads
  - Reference Data
  - XD
- name: INRIX Data Upload Service (GPS, XFCD and Parking Event Streams)
  description: >-
    Inbound data streams for partners contributing probe data to INRIX: batched JSON POSTs of GPS points,
    extended floating car data (XFCD) readings, and parking events, consumed asynchronously with sub-second
    acknowledgement.
  humanURL: https://docs.inrix.com/sendingdata/gpsdatastream/
  baseURL: https://appsvc-ingest.inrix.io
  tags:
  - Data Ingest
  - Streams
  - GPS
  - XFCD
  - Probe Data
- name: INRIX Gateway Map Version API
  description: >-
    Reports the current INRIX map and XD network version in use, so consumers can align segment identifiers
    with the correct map release.
  humanURL: https://docs.inrix.com/reference/mapversion/
  baseURL: https://gateway-api.inrix.com
  tags:
  - Reference Data
  - Versioning
  - Maps
  - XD
  - Metadata
- name: INRIX Connected Services Gateway API
  description: >-
    The long-standing INRIX Connected Services gateway (Inrix.ashx), which serves routing, drive time
    polygons, traffic cameras, road speed at points, segment sets and speed buckets through Action-style
    requests against a regionally issued server path.
  humanURL: https://docs.inrix.com/authentication/getting_authorized/
  baseURL: https://na-api2.inrix.com
  tags:
  - Routing
  - Traffic
  - Camera
  - Drive Time
  - Gateway
  tags_raw:
  - Routing
  - Traffic
  - Cameras
  - Drive Time
  - Gateway
- name: INRIX TPEG Connect
  description: >-
    Delivers INRIX traffic, incident, parking, weather and fuel content in TISA TPEG format over HTTP
    POST sessions, with incremental deltas, configurable content radii, compression and encryption for
    embedded automotive head units.
  humanURL: https://docs.inrix.com/traffic/tpeg/
  baseURL: https://na-tts.inrix.com
  tags:
  - TPEG
  - Automotive
  - Streaming
  - Traffic
  - Standards
- name: INRIX Visits Analytics API
  description: >-
    Anonymized visit counts and dwell analytics for points of interest and custom polygons, derived from
    INRIX device and vehicle movement data.
  humanURL: https://docs.inrix.com/analytics/analyticsvisits/
  baseURL: https://analytics-visits.inrix.com
  tags:
  - Analytics
  - Visits
  - Location Intelligence
  - Retail
  - Foot Traffic
