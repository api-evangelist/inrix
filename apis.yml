- name: INRIX Segment Speed API
  description: Real-time, historical and predicted speed, travel time and reference speed for INRIX XD and TMC road
    segments, queried by bounding box, radius, point, segment set or corridor.
  humanURL: https://docs.inrix.com/traffic/segmentspeed/
  baseURL: https://segment-api.inrix.com
  tags:
