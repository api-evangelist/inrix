- name: INRIX Safety Alerts (Incidents) API
  description: Roadway incident, construction, flow, event and hazard alerts within a bounding box, radius or along
    a route, with TMC and OpenLR location referencing and TPEG-style event codes.
  humanURL: https://docs.inrix.com/traffic/incidents/
  baseURL: https://incident-api.inrix.com
  tags:
