aid: inrix
name: INRIX
description: 'INRIX is a Kirkland, Washington-based transportation analytics company that turns anonymized GPS probe
  data from connected vehicles, mobile devices and fleets into real-time and historical road intelligence for automakers,
  cities, departments of transportation, retailers and app developers. Its developer surface is organized around
  the INRIX IQ platform and documented at docs.inrix.com, spanning Traffic APIs (segment speed, safety alerts/incidents,
  traffic tiles, routing, drive time polygons, traffic cameras, dangerous slowdowns, fuel stations and TPEG Connect),
  Parking APIs (INRIX Parking Services 3.0, formerly ParkMe: lots, blocks, occupancy and probability, destinations
  and reservations), Analytics APIs (trade area trips, trip trends, visits, dangerous roads and Roadway Analytics),
  Signals intersection analytics, a Data Download Service for map and XD network releases, and data-upload streams
  for GPS, XFCD and parking events. All access is brokered through the INRIX User Accounts System (UAS), which exchanges
  an appId and a SHA-1 hashToken for a bearer access token used across every product API.'
