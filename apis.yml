  - Maps
  - Traffic
  - Raster
  - Visualization
- name: INRIX Fuel Stations API
  description: Fuel station locations, brands, amenities and current fuel prices by grade, searchable by bounding
    box, radius or station identifier.
  humanURL: https://docs.inrix.com/traffic/fuel/
  baseURL: https://fuel-api.inrix.com
  tags:
