model: separate beta / sandbox / qa hostnames rather than test-mode keys
note: INRIX does not use a test-vs-live key prefix. Test traffic is directed at parallel beta, sandbox or qa hostnames
  using the same credential flow. Tokens are not interchangeable between environments.
environments:
- name: Parking beta
  pattern: Substitute beta.parkme.com for parkme.com
  url: https://docs.inrix.com/parking/beta/
  host_map:
  - production: api.parkme.com
    beta: api.beta.parkme.com
  - production: parking-api.inrix.com
    beta: api.beta.parkme.com
  - production: www.parkme.com
    beta: www.beta.parkme.com
  - production: operator.parkme.com
    beta: operator.beta.parkme.com
  - production: admin.parkme.com
    beta: admin.beta.parkme.com
  purpose: A safe and secure way to test any part of the parking system without using real credit card information
    or modifying production data.
  payments:
    real_cards_rejected: true
    test_instrument: Stripe test cards
    note: INRIX documents that real credit cards will not work against the beta endpoints and directs callers to
      use Stripe test cards for requests and reservations. INRIX publishes no test card numbers of its own; use
      the Stripe published test card set.
    reference: https://docs.stripe.com/testing
- name: Data upload beta
  production: https://appsvc-ingest.inrix.io
  beta: https://appsvc-ingest.beta.inrix.io
  endpoints:
  - /v1/gpsdatastream
  - /v1/parkdatastream
  - /v1/datastream
  purpose: For testing purposes, including sending test data.
  constraint: The beta endpoint should not be used for load testing, since it has 10x less capacity than production.
- name: Data download qa
  production: https://mapdata.inrix.io
  qa: https://mapdata.qa.inrix.io
  portal:
